[project]
name = "mayan-sync-control"
version = "0.1.0"
description = "Prototype runtime for Mayan Sync Control agent"
authors = [{name = "Mayan Sync"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mayan-sync-agent = "mayan_sync_control.cli:main"

[build-system]
requires = ["setuptools>=67"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
addopts = "-q"
